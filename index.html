<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ANTE — Home Game Ledger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --felt: #0e4735;
  --felt-2: #135840;
  --felt-deep: #072a20;
  --ivory: #f1ead9;
  --ivory-dim: #b9b3a0;
  --brass: #c9a227;
  --brass-light: #e7c454;
  --line: rgba(241,234,217,0.14);
  --line-soft: rgba(241,234,217,0.08);
  --panel: rgba(241,234,217,0.045);
  --panel-2: rgba(241,234,217,0.075);
  --chip-white: #f3ecdd;
  --chip-red: #c1392b;
  --chip-green: #2f8f5b;
  --chip-blue: #2d6a9f;
  --chip-black: #1c1c1c;
  --profit: #56b788;
  --loss: #e2665a;
  --radius: 16px;
  --radius-sm: 10px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; min-height:100%; }
body{
  font-family: var(--font-body);
  color: var(--ivory);
  background:
    radial-gradient(ellipse 1200px 700px at 50% -10%, var(--felt-2), transparent 60%),
    linear-gradient(160deg, var(--felt) 0%, var(--felt-deep) 100%);
  background-attachment: fixed;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body::before{
  content:'';
  position: fixed; inset:0; pointer-events:none; z-index:0;
  background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
  opacity:0.5;
}
#app{ position:relative; z-index:1; }

::selection{ background: var(--brass); color:#1a1206; }
button{ font-family:inherit; }
input, select{ font-family:inherit; }
.mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.profit{ color: var(--profit); }
.loss{ color: var(--loss); }

a, .link-btn{ background:none; border:none; color: var(--brass-light); font-size:0.9rem; cursor:pointer; padding:0; text-decoration: underline; text-underline-offset:3px; }
.center-link{ display:block; margin:24px auto 40px; text-align:center; }

/* ============ Buttons ============ */
.btn{
  font-family: var(--font-body); font-weight:600; font-size:0.92rem;
  padding: 11px 20px; border-radius: 999px; border: 1px solid transparent;
  cursor:pointer; transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
  white-space: nowrap;
}
.btn:active{ transform: scale(0.97); }
.btn-primary{ background: linear-gradient(160deg, var(--brass-light), var(--brass)); color:#241a04; box-shadow: 0 2px 10px rgba(201,162,39,0.35); }
.btn-primary:hover{ box-shadow: 0 4px 16px rgba(201,162,39,0.5); }
.btn-secondary{ background: var(--ivory); color:#1a2b22; }
.btn-outline{ background:transparent; border-color: var(--line); color: var(--ivory); }
.btn-outline:hover{ background: var(--panel); }
.btn-ghost{ background:transparent; border-color:transparent; color: var(--ivory-dim); }
.btn-ghost:hover{ color: var(--ivory); }
.btn-block{ width:100%; display:block; text-align:center; margin-top:16px; }
.btn-sm{ padding:8px 14px; font-size:0.82rem; }
.btn-lg{ padding:15px 24px; font-size:1rem; }

.icon-btn{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background: var(--panel);
  color: var(--ivory); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:0.95rem;
  transition: background .15s ease;
}
.icon-btn:hover{ background: var(--panel-2); }
.icon-btn.ghost{ border-color:transparent; background:transparent; color: var(--ivory-dim); width:28px; height:28px; font-size:0.8rem; }
.icon-btn.ghost:hover{ color: var(--loss); }

/* ============ Chip dot / avatar ============ */
.chip-dot{
  display:inline-block; border-radius:50%; flex-shrink:0;
  background: var(--c);
  border: 1px solid rgba(0,0,0,0.35);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,0.16), inset 0 0 0 4px rgba(0,0,0,0.12);
}
.avatar{
  border-radius:50%;
  background: var(--ac);
  background: linear-gradient(150deg, var(--ac), color-mix(in srgb, var(--ac) 65%, black));
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display); font-weight:600; color:#fff;
  flex-shrink:0; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

/* ============ Brand ============ */
.brand{ display:flex; align-items:center; gap:12px; justify-content:center; }
.brand h1{ font-family: var(--font-display); font-size:2.1rem; font-weight:700; letter-spacing:0.06em; margin:0; color: var(--ivory); }
.brand-mark{ color: var(--brass); font-size:2.2rem; }
.brand-sm{ display:flex; align-items:center; gap:8px; font-family: var(--font-display); font-weight:700; font-size:1.05rem; letter-spacing:0.04em; }
.brand-sm .brand-mark{ font-size:1.1rem; }
.brand-sm.center{ justify-content:center; }

/* ============ Landing ============ */
.landing{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px 12px; }
.landing-inner{ width:100%; max-width:880px; }
.tagline{ text-align:center; color: var(--ivory-dim); margin:10px 0 28px; font-size:0.95rem; }
.landing-cards{ display:grid; grid-template-columns:1fr; gap:16px; }
.landing-card{
  background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
  padding:18px; backdrop-filter: blur(6px);
}
.landing-card h2{ font-family: var(--font-display); font-size:1.35rem; margin:0 0 4px; }
.card-sub{ color: var(--ivory-dim); font-size:0.87rem; margin:0 0 18px; line-height:1.5; }
.field-label{ display:block; font-size:0.76rem; text-transform:uppercase; letter-spacing:0.07em; color: var(--ivory-dim); margin:14px 0 6px; }
.field-label:first-of-type{ margin-top:0; }
.text-input, .select-input{
  width:100%; padding:11px 14px; border-radius: var(--radius-sm); border:1px solid var(--line);
  background: rgba(0,0,0,0.18); color: var(--ivory); font-size:0.95rem;
}
.text-input:focus, .select-input:focus, .cv-input:focus{ outline:none; border-color: var(--brass); }
.code-input{ text-transform:uppercase; letter-spacing:0.2em; font-family: var(--font-mono); text-align:center; font-size:1.1rem; }
.chip-value-grid{ display:flex; flex-direction:column; gap:8px; }
.cv-item{ display:flex; align-items:center; gap:10px; font-size:0.9rem; }
.cv-item span:nth-child(2){ flex:1; }
.cv-inputwrap{ display:flex; align-items:center; gap:2px; background:rgba(0,0,0,0.18); border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-family:var(--font-mono); font-size:0.88rem; }
.cv-input{ width:56px; background:transparent; border:none; color:var(--ivory); font-family:var(--font-mono); font-size:0.88rem; padding:2px; }
.field-hint{ text-transform:none; letter-spacing:normal; font-weight:400; color: var(--ivory-dim); opacity:0.8; }
.recipe-grid{ display:flex; flex-direction:column; gap:8px; background: rgba(0,0,0,0.12); border:1px solid var(--line-soft); border-radius: var(--radius-sm); padding:12px 14px; }
.recipe-item{ display:flex; align-items:center; gap:10px; font-size:0.88rem; }
.recipe-item .ri-label{ flex:1; }
.recipe-item input{ width:46px; text-align:center; background:rgba(0,0,0,0.22); border:1px solid var(--line); border-radius:8px; padding:5px 2px; color:var(--ivory); font-family:var(--font-mono); font-size:0.86rem; }
.recipe-item input::-webkit-outer-spin-button, .recipe-item input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.ri-sub{ min-width:56px; text-align:right; color: var(--ivory-dim); font-size:0.8rem; }
.recipe-total{ display:flex; justify-content:space-between; margin-top:4px; padding-top:10px; border-top:1px solid var(--line-soft); font-weight:700; font-size:0.95rem; color: var(--brass-light); }

/* ============ Rail / header ============ */
.rail{
  display:flex; align-items:stretch; justify-content:space-between; gap:12px; flex-direction:column;
  padding:12px 14px; background: rgba(7,42,32,0.55); border-bottom:1px solid var(--line);
  backdrop-filter: blur(8px); flex-wrap:wrap;
}
.rail-left{ display:flex; align-items:center; gap:14px; }
.game-name{ color: var(--ivory-dim); font-size:0.85rem; padding-left:14px; border-left:1px solid var(--line); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rail-mid{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:space-between; }
.stat{ display:flex; flex-direction:column; gap:2px; }
.stat-label{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.07em; color: var(--ivory-dim); }
.stat-val{ font-size:0.95rem; font-weight:600; }
.code-badge{
  background: var(--panel); border:1px solid var(--line); color: var(--brass-light);
  font-family: var(--font-mono); font-size:0.92rem; font-weight:600; letter-spacing:0.1em;
  padding:4px 10px; border-radius:8px; cursor:pointer;
}
.code-badge:hover{ background: var(--panel-2); }
.copy-ico{ opacity:0.6; font-size:0.8em; }
.rail-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:space-between; }
.chip-legend{ display:flex; gap:8px; flex-wrap:wrap; }
.legend-item{ display:flex; align-items:center; gap:5px; font-size:0.76rem; color: var(--ivory-dim); }

/* ============ Table area / player grid ============ */
.table-area{ padding:16px 12px 4px; max-width:1240px; margin:0 auto; }
.player-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap:16px; }
.player-card{
  background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
  padding:18px; display:flex; flex-direction:column; gap:12px;
  animation: dealIn .38s ease backwards;
}
.player-card:nth-child(1){ animation-delay:.02s; } .player-card:nth-child(2){ animation-delay:.06s; }
.player-card:nth-child(3){ animation-delay:.10s; } .player-card:nth-child(4){ animation-delay:.14s; }
.player-card:nth-child(5){ animation-delay:.18s; } .player-card:nth-child(n+6){ animation-delay:.2s; }
@keyframes dealIn{ from{ opacity:0; transform: translateY(10px) scale(0.98); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce){ .player-card{ animation:none; } }

.pc-top{ display:flex; align-items:center; gap:12px; }
.pc-info{ flex:1; min-width:0; }
.pc-name{ font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
.edit-hint{ opacity:0; font-size:0.75rem; transition:opacity .15s; }
.pc-name:hover .edit-hint{ opacity:0.5; }
.pc-meta{ font-size:0.78rem; color: var(--ivory-dim); margin-top:2px; }
.pc-value{ font-size:1.7rem; font-weight:700; display:flex; align-items:baseline; gap:8px; }
.pc-value-label{ font-size:0.72rem; font-weight:500; text-transform:uppercase; letter-spacing:0.06em; color: var(--ivory-dim); font-family:var(--font-body); }
.chip-breakdown{ display:flex; gap:8px; flex-wrap:wrap; }
.chip-breakdown.empty{ color: var(--ivory-dim); font-size:0.78rem; font-style:italic; }
.hb-item{ display:flex; align-items:center; gap:4px; font-size:0.8rem; font-family: var(--font-mono); color: var(--ivory-dim); background: rgba(0,0,0,0.15); padding:3px 8px 3px 5px; border-radius:999px; }
.pc-actions{ display:flex; gap:8px; margin-top:auto; }
.pc-actions .btn{ flex:1; }
.pc-actions.secondary{ margin-top:0; }
.buyin-btn{ display:flex; align-items:center; justify-content:center; gap:6px; }

.add-player-tile{
  border:1.5px dashed var(--line); border-radius: var(--radius); background:transparent; color: var(--ivory-dim);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer;
  min-height:150px; transition: border-color .15s, color .15s;
}
.add-player-tile:hover{ border-color: var(--brass); color: var(--brass-light); }
.add-player-tile .plus{ font-size:1.8rem; line-height:1; }

/* ============ Poker table & seats ============ */
.poker-table-wrap{ position:relative; padding: 30px 10px; max-width:760px; margin:0 auto; }
.poker-table{
  position:relative; width:100%; aspect-ratio: 4/5; border-radius:50%;
  background: radial-gradient(ellipse at 50% 38%, var(--felt-2), var(--felt) 72%);
  border: 9px solid #6b4a23;
  box-shadow: inset 0 0 0 4px rgba(0,0,0,0.25), inset 0 12px 46px rgba(0,0,0,0.35), 0 20px 50px rgba(0,0,0,0.4);
  animation: dealIn .4s ease backwards;
}
@media (min-width:680px){ .poker-table{ aspect-ratio: 16/9; } }
.table-center{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; width:70%; }
.tc-suit{ font-size:1.4rem; color: rgba(241,234,217,0.16); margin-bottom:4px; }
.tc-total{ font-size:1.05rem; font-weight:700; color: var(--brass-light); }
.tc-label{ font-size:0.65rem; text-transform:uppercase; letter-spacing:0.06em; color: var(--ivory-dim); }
.seat{
  position:absolute; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:2px;
  background: rgba(14,71,53,0.92); border:1px solid var(--line); border-radius: 14px;
  padding:8px 6px; cursor:pointer; width:72px; font-family:inherit;
  box-shadow: 0 6px 16px rgba(0,0,0,0.35);
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  animation: dealIn .38s ease backwards;
}
.seat:hover{ box-shadow: 0 8px 22px rgba(0,0,0,0.45); border-color: var(--brass); }
.seat:active{ transform:translate(-50%,-50%) scale(0.95); }
.seat-name{ font-size:0.68rem; font-weight:600; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color: var(--ivory); }
.seat-value{ font-size:0.68rem; color: var(--brass-light); font-weight:600; }
.seat-badge{
  position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:0.65rem; border:2px solid var(--felt-deep);
}
.seat-badge.profit{ background: var(--profit); color:#06251a; }
.seat-badge.loss{ background: var(--loss); color:#2b0906; }
.add-player-pill{
  display:block; margin:18px auto 0; padding:11px 24px; border-radius:999px;
  border:1.5px dashed var(--line); background:transparent; color: var(--ivory-dim); cursor:pointer; font-size:0.9rem;
  transition: border-color .15s, color .15s;
}
.add-player-pill:hover{ border-color: var(--brass); color: var(--brass-light); }

/* ============ Player menu modal ============ */
.pm-head{ display:flex; align-items:center; gap:12px; }
.pm-head h3{ font-size:1.1rem; margin:0 0 2px; }
.pm-actions{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
.pm-footer{ display:flex; justify-content:space-between; margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft); }
.link-btn.danger{ color: var(--loss); }
.cashed-note{ font-size:0.82rem; color: var(--brass-light); background: rgba(201,162,39,0.12); border:1px solid rgba(201,162,39,0.3); border-radius:8px; padding:7px 10px; margin-top:-4px; }
.id-box{ background: rgba(0,0,0,0.28); border:1px solid var(--line); border-radius:10px; padding:14px; font-size:0.85rem; word-break:break-all; margin-bottom:14px; color: var(--brass-light); text-align:center; }
.livecheck-box{ background: rgba(0,0,0,0.15); border:1px solid var(--line-soft); border-radius:10px; padding:10px 12px; margin:2px 0 4px; display:flex; flex-direction:column; gap:8px; }
.lc-row{ display:flex; align-items:center; justify-content:space-between; font-size:0.85rem; }

/* ============ Transfer mode toggle ============ */
.seg-control{ display:flex; background: rgba(0,0,0,0.2); border-radius:999px; padding:3px; margin:10px 0 12px; }
.seg-btn{ flex:1; border:none; background:transparent; color: var(--ivory-dim); padding:8px 10px; border-radius:999px; font-size:0.84rem; font-weight:600; cursor:pointer; transition: background .15s, color .15s; }
.seg-btn.active{ background: var(--brass); color:#241a04; }
.qty-row{ display:flex; align-items:center; justify-content:space-between; padding:6px 0 10px; }
.qty-row .stepper input{ width:56px; }
.qty-breakdown{ display:flex; gap:8px; flex-wrap:wrap; padding:4px 0 6px; }
.empty-note-sm{ font-size:0.8rem; color: var(--ivory-dim); font-style:italic; }

/* ============ Ledger ============ */
.ledger{ max-width:1240px; margin:8px auto 32px; padding:0 12px; }
.ledger-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.ledger-head h3{ font-family: var(--font-display); font-weight:600; font-size:1.05rem; margin:0; color: var(--ivory-dim); }
.ledger-list{ background: var(--panel); border:1px solid var(--line); border-radius: var(--radius); overflow:hidden; max-height:320px; overflow-y:auto; }
.ledger-row{ display:flex; align-items:center; gap:12px; padding:11px 18px; border-bottom:1px solid var(--line-soft); font-size:0.87rem; }
.ledger-row:last-child{ border-bottom:none; }
.lr-time{ color: var(--ivory-dim); font-size:0.78rem; width:56px; flex-shrink:0; }
.lr-icon{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.75rem; flex-shrink:0; }
.lr-icon.buyin{ background: rgba(86,183,136,0.18); color: var(--profit); }
.lr-icon.transfer{ background: rgba(201,162,39,0.18); color: var(--brass-light); }
.lr-icon.cashout{ background: rgba(201,162,39,0.28); font-size:0.9rem; }
.lr-text{ flex:1; color: var(--ivory-dim); }
.lr-text b{ color: var(--ivory); font-weight:600; }
.lr-amt{ font-weight:600; }
.empty-note{ padding:22px; text-align:center; color: var(--ivory-dim); font-size:0.88rem; }

/* ============ Toast ============ */
.toast{
  position: fixed; bottom:26px; left:50%; transform:translateX(-50%);
  background: #1a1206; color: var(--brass-light); border:1px solid var(--brass);
  padding:11px 22px; border-radius:999px; font-size:0.87rem; font-weight:500;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index:500; animation: toastIn .25s ease;
}
@keyframes toastIn{ from{opacity:0; transform:translateX(-50%) translateY(10px);} to{opacity:1; transform:translateX(-50%);} }

/* ============ Modal ============ */
.overlay{
  position:fixed; inset:0; background: rgba(3,15,11,0.72); backdrop-filter: blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:400; padding:10px;
  animation: overlayIn .18s ease;
}
@keyframes overlayIn{ from{opacity:0;} to{opacity:1;} }
.modal{
  background: linear-gradient(165deg, #144a37, #0d3527); border:1px solid var(--line);
  border-radius: var(--radius); width:100%; max-width:440px; max-height:92vh; overflow-y:auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: modalIn .22s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes modalIn{ from{ opacity:0; transform: translateY(14px) scale(0.97); } to{ opacity:1; transform:none; } }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 16px 12px; border-bottom:1px solid var(--line-soft); }
.modal-head h3{ font-family: var(--font-display); font-size:1.1rem; margin:0; }
.modal-body{ padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
.modal-note{ font-size:0.83rem; color: var(--ivory-dim); line-height:1.5; margin:0 0 4px; }
.modal-note.center{ text-align:center; max-width:560px; margin:0 auto 20px; }
.modal-hint{ font-size:0.8rem; color: var(--brass-light); margin:4px 0 0; }
.modal-total{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-top:1px solid var(--line-soft); font-weight:700; font-size:1.1rem; }
.modal-total.sm{ font-size:0.95rem; padding:10px 0 0; border-top:none; }
.modal-actions{ display:flex; gap:10px; padding:12px 16px 16px; }
.modal-actions .btn{ flex:1; }

.chip-row{ display:grid; grid-template-columns: minmax(0,1fr) auto auto; align-items:center; gap:8px; padding:6px 0; }
.chip-row-label{ display:flex; align-items:center; gap:8px; font-size:0.9rem; min-width:0; }
.chip-val{ display:none; color: var(--ivory-dim); font-size:0.76rem; font-family: var(--font-mono); }
.stepper{ display:flex; align-items:center; gap:5px; }
.step-btn{ width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background: rgba(0,0,0,0.18); color: var(--ivory); font-size:0.92rem; cursor:pointer; line-height:1; flex-shrink:0; }
.step-btn:hover{ background: rgba(0,0,0,0.3); }
.stepper input{
  width:40px; text-align:center; padding:6px 2px; border-radius:8px; border:1px solid var(--line);
  background: rgba(0,0,0,0.18); color: var(--ivory); font-family: var(--font-mono); font-size:0.85rem;

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-app-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-database-compat.js"></script>
<script>
/* ============================= FIREBASE ============================= */
const firebaseConfig = {
  apiKey: "AIzaSyCfyf4A1QSVjMkdn52okBxSLknZorwekpk",
  authDomain: "poker-room-ca358.firebaseapp.com",
  databaseURL: "https://poker-room-ca358-default-rtdb.firebaseio.com",
  projectId: "poker-room-ca358",
  storageBucket: "poker-room-ca358.firebasestorage.app",
  messagingSenderId: "530761900889",
  appId: "1:530761900889:web:5b833a2bc8191c4c0b6248"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let roomRef = null;
let pendingRemoteUpdate = null;

/* ============================= CONSTANTS ============================= */
const CHIP_COLORS = ['white','red','green','blue','black'];
const CHIP_LABELS = {white:'White',red:'Red',green:'Green',blue:'Blue',black:'Black'};
const CHIP_HEX = {white:'#f3ecdd',red:'#c1392b',green:'#2f8f5b',blue:'#2d6a9f',black:'#1c1c1c'};
const DEFAULT_CHIP_VALUES = {white:1,red:4,green:8,blue:20,black:40};
const DEFAULT_BUY_IN_RECIPE = {white:0,red:5,green:5,blue:5,black:5};
const AVATAR_COLORS = ['#c9a227','#b5654a','#4f8f6e','#3f6e8c','#8a5a83','#b89b5e','#4e8b8b','#a2543c','#7a8a4e','#9c6a3f'];
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

/* ============================= STATE ============================= */
let state = {
  view: 'landing', // landing | game | endgame | results | group
  code: null,
  game: null,
  group: null,           // currently loaded group (season) doc — also attached to a game for check-in lookups
  groupGamesCache: null, // array of loaded room objects for the open group's game days
  modal: null,
  modalData: { newChipValues: {...DEFAULT_CHIP_VALUES}, newBuyInRecipe: {...DEFAULT_BUY_IN_RECIPE} },
  toast: null,
  confettiPlayed: false,
  toastTimer: null,
};

/* ============================= UTILS ============================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function genRoomCode(){ let c=''; for(let i=0;i<4;i++) c += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]; return c; }
function genMemberCode(existing){
  existing = existing || [];
  let code;
  do{ code = String(Math.floor(1000+Math.random()*9000)); }while(existing.includes(code));
  return code;
}
function extractRoomId(input){
  input = (input||'').trim().toUpperCase();
  const match = input.match(new RegExp(`[${CODE_CHARS}]{4}`));
  return match ? match[0] : input;
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function fmt(n){ n = Math.round(n||0); const sign = n<0 ? '-' : ''; return sign + '₹' + Math.abs(n).toLocaleString('en-IN'); }
function fmtPnl(n){ n = Math.round(n||0); if(n>0) return '+₹'+n.toLocaleString('en-IN'); if(n<0) return '−₹'+Math.abs(n).toLocaleString('en-IN'); return '₹0'; }
function fmtElapsed(ms){ if(ms<0) ms=0; const mins=Math.floor(ms/60000); const h=Math.floor(mins/60); const m=mins%60; return h>0 ? `${h}h ${m}m` : `${m}m`; }
function emptyChips(){ return {white:0,red:0,green:0,blue:0,black:0}; }
function addChips(a,b){ const r=emptyChips(); CHIP_COLORS.forEach(c=> r[c]=(a[c]||0)+(b[c]||0)); return r; }
function subChips(a,b){ const r=emptyChips(); CHIP_COLORS.forEach(c=> r[c]=(a[c]||0)-(b[c]||0)); return r; }
function scaleChips(chips, factor){ const r=emptyChips(); CHIP_COLORS.forEach(c=> r[c]=(chips[c]||0)*factor); return r; }
function chipValueOf(chips, chipValues){ return CHIP_COLORS.reduce((s,c)=> s+(chips[c]||0)*(chipValues[c]||0), 0); }

/* ============================= DERIVED ============================= */
function activePlayers(g){ return g.players.filter(p=>!p.removed); }
function playerById(g,id){ return g.players.find(p=>p.id===id); }
function chipsHeld(g, playerId){
  let held = emptyChips();
  g.actions.forEach(a=>{
    if(a.type==='buyin' && a.playerId===playerId) held = addChips(held, a.chips);
    if(a.type==='transfer' && a.fromId===playerId) held = subChips(held, a.chips);
    if(a.type==='transfer' && a.toId===playerId) held = addChips(held, a.chips);
  });
  return held;
}
function inPlay(g, playerId){ return chipValueOf(chipsHeld(g, playerId), g.chipValues); }
function totalBuyins(g){ return g.actions.filter(a=>a.type==='buyin').reduce((s,a)=> s+chipValueOf(a.chips, g.chipValues), 0); }
function recipeOf(g){ return g.buyInRecipe || DEFAULT_BUY_IN_RECIPE; }
function recipeValue(g){ return chipValueOf(recipeOf(g), g.chipValues); }
function buyinCount(g, playerId){ return g.actions.filter(a=>a.type==='buyin' && a.playerId===playerId).length; }
function transferCount(g, playerId){ return g.actions.filter(a=>a.type==='transfer' && (a.fromId===playerId || a.toId===playerId)).length; }
function cashedOutBy(g, playerId){ return g.actions.filter(a=>a.type==='transfer' && a.fromId===playerId && a.toId==='BANK').reduce((s,a)=> s+chipValueOf(a.chips, g.chipValues), 0); }
function totalCashedOut(g){ return g.actions.filter(a=>a.type==='transfer' && a.toId==='BANK').reduce((s,a)=> s+chipValueOf(a.chips, g.chipValues), 0); }
function finalVal(g, playerId){ const fc = g.finalChips && g.finalChips[playerId]; return fc ? chipValueOf(fc, g.chipValues) : 0; }
function pnl(g, playerId){ return finalVal(g, playerId) - inPlay(g, playerId); }
function liveCheckOf(g, playerId){ return (g.liveChecks && g.liveChecks[playerId]) || null; }
function liveEstimatedPnl(g, playerId){
  const check = liveCheckOf(g, playerId);
  if(!check) return null;
  return chipValueOf(check.chips, g.chipValues) - inPlay(g, playerId);
}
function fmtAgo(ts){
  const mins = Math.floor((Date.now()-ts)/60000);
  if(mins<1) return 'just now';
  if(mins<60) return `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  return `${hrs}h ${mins%60}m ago`;
}
function computeSettlementsFromRows(rows){
  // rows: [{name, amt}] — a positive amt is owed money, negative amt owes money
  const creditors = rows.filter(r=>r.amt>0).map(r=>({...r})).sort((a,b)=>b.amt-a.amt);
  const debtors = rows.filter(r=>r.amt<0).map(r=>({...r, amt:-r.amt})).sort((a,b)=>b.amt-a.amt);
  const settlements = [];
  let i=0, j=0;
  while(i<debtors.length && j<creditors.length){
    const d=debtors[i], c=creditors[j];
    const amt = Math.min(d.amt, c.amt);
    if(amt>0) settlements.push({from:d.name, to:c.name, amount:amt});
    d.amt -= amt; c.amt -= amt;
    if(d.amt<=0) i++;
    if(c.amt<=0) j++;
  }
  return settlements;
}
function computeSettlements(g){
  const rows = activePlayers(g).map(p=>({name:p.name, amt: Math.round(pnl(g,p.id))}));
  return computeSettlementsFromRows(rows);
}
/* ============ Group (season) aggregation ============ */
function groupFinishedGames(games){ return (games||[]).filter(g=>g && g.ended); }
function aggregateGroupStats(group, games){
  const totals = {};
  (group.members||[]).forEach(m=>{ totals[m.id] = { id:m.id, name:m.name, color:m.color, totalPnl:0, gamesPlayed:0 }; });
  groupFinishedGames(games).forEach(g=>{
    activePlayers(g).forEach(p=>{
      if(!p.memberId || !totals[p.memberId]) return;
      const t = totals[p.memberId];
      t.totalPnl += pnl(g, p.id);
      t.gamesPlayed += 1;
    });
  });
  return Object.values(totals).filter(t=>t.gamesPlayed>0).sort((a,b)=>b.totalPnl-a.totalPnl);
}

/* Firebase's Realtime Database silently drops empty arrays/objects on write —
   a brand-new room's players:[] and actions:[] literally don't get stored,
   so they come back as `undefined` and crash anything that reads them.
   Every game object coming FROM Firebase passes through here first. */
function normalizeGame(g){
  if(!g) return g;
  g.players = Array.isArray(g.players) ? g.players : (g.players ? Object.values(g.players) : []);
  g.actions = Array.isArray(g.actions) ? g.actions : (g.actions ? Object.values(g.actions) : []);
  g.finalChips = g.finalChips || {};
  g.liveChecks = g.liveChecks || {};
  g.chipValues = g.chipValues || {...DEFAULT_CHIP_VALUES};
  g.buyInRecipe = g.buyInRecipe || {...DEFAULT_BUY_IN_RECIPE};
  return g;
}
function normalizeGroup(grp){
  if(!grp) return grp;
  grp.members = Array.isArray(grp.members) ? grp.members : (grp.members ? Object.values(grp.members) : []);
  grp.gameDays = Array.isArray(grp.gameDays) ? grp.gameDays : (grp.gameDays ? Object.values(grp.gameDays) : []);
  grp.gameDays.sort((a,b)=>(a.day||0)-(b.day||0));
  return grp;
}

/* ============================= STORAGE (Firebase Realtime Database) ============================= */
async function loadGame(id){
  if(!id) return null;
  const snap = await db.ref('rooms/'+id).once('value'); // let real errors propagate to the caller
  return snap.exists() ? normalizeGame(snap.val()) : null;
}
async function saveGame(){
  if(!state.game || !roomRef) return;
  state.game.updatedAt = Date.now();
  try{
    await roomRef.set(state.game);
  }catch(e){
    console.error('save failed', e);
    flashToast('Sync write failed: ' + (e.code || e.message || 'unknown error'));
  }
}
function handleRemoteSnapshot(snapshot){
  const remote = snapshot.val();
  if(!remote) return;
  normalizeGame(remote);
  if(state.modal){ pendingRemoteUpdate = remote; return; }
  applyRemoteUpdate(remote);
}
function applyRemoteUpdate(remote){
  normalizeGame(remote);
  if((remote.updatedAt||0) < (state.game?.updatedAt||0)) return;
  state.game = remote;
  ensureGroupContext(remote);
  if(remote.ended) state.view = 'results';
  else if(state.view==='results') state.view = 'game';
  render();
}
function attachRoom(id){
  detachRoom();
  roomRef = db.ref('rooms/'+id);
  roomRef.on('value', handleRemoteSnapshot);
}
function detachRoom(){
  if(roomRef){ roomRef.off('value', handleRemoteSnapshot); roomRef = null; }
}
function ensureGroupContext(g){
  if(g && g.groupCode && (!state.group || state.group.code !== g.groupCode)) attachGroupRoom(g.groupCode);
}

/* ============================= STORAGE (Groups / Season) ============================= */
let groupRef = null;
let pendingRemoteGroupUpdate = null;
async function loadGroup(code){
  if(!code) return null;
  const snap = await db.ref('groups/'+code).once('value');
  return snap.exists() ? normalizeGroup(snap.val()) : null;
}
function handleRemoteGroupSnapshot(snapshot){
  const remote = snapshot.val();
  if(!remote) return;
  normalizeGroup(remote);
  if(state.modal){ pendingRemoteGroupUpdate = remote; return; }
  applyRemoteGroupUpdate(remote);
}
function applyRemoteGroupUpdate(remote){
  normalizeGroup(remote);
  if((remote.updatedAt||0) < (state.group?.updatedAt||0)) return;
  state.group = remote;
  render();
}
function attachGroupRoom(code){
  detachGroupRoom();
  groupRef = db.ref('groups/'+code);
  groupRef.on('value', handleRemoteGroupSnapshot);
}
function detachGroupRoom(){
  if(groupRef){ groupRef.off('value', handleRemoteGroupSnapshot); groupRef = null; }
}
function mergeGroups(remote, local){
  if(!remote) return local;
  const merged = { ...remote };
  const remoteMemberIds = new Set(remote.members.map(m=>m.id));
  const extraMembers = local.members.filter(m=>!remoteMemberIds.has(m.id));
  merged.members = [...remote.members, ...extraMembers];
  const remoteDayCodes = new Set(remote.gameDays.map(d=>d.code));
  const extraDays = local.gameDays.filter(d=>!remoteDayCodes.has(d.code));
  merged.gameDays = [...remote.gameDays, ...extraDays].sort((a,b)=>(a.day||0)-(b.day||0));
  if((local.updatedAt||0) > (remote.updatedAt||0)) merged.name = local.name;
  return merged;
}
async function mutateAndSaveGroup(mutator){
  let remote = null;
  try{
    remote = await loadGroup(state.group.code);
  }catch(e){
    console.error('read before group mutate failed', e);
    flashToast('Sync read issue (' + (e.code || e.message || 'unknown') + ') — saved locally');
  }
  const base = mergeGroups(remote, state.group);
  mutator(base);
  base.updatedAt = Date.now();
  state.group = base;
  render();
  try{
    await db.ref('groups/'+base.code).set(base);
  }catch(e){
    console.error('group save failed', e);

}

/* Merge another device's saved state with ours: union actions & players by id
   (so two phones adding a buy-in/player at the same moment both survive),
   and let whichever side edited most recently win on single-value settings. */
function mergeGames(remote, local){
  if(!remote) return local;
  const merged = { ...remote };
  const remoteActionIds = new Set(remote.actions.map(a=>a.id));
  const extraActions = local.actions.filter(a=>!remoteActionIds.has(a.id));
  merged.actions = [...remote.actions, ...extraActions].sort((a,b)=>a.ts-b.ts);
  const remotePlayerIds = new Set(remote.players.map(p=>p.id));
  const extraPlayers = local.players.filter(p=>!remotePlayerIds.has(p.id));
  merged.players = [...remote.players, ...extraPlayers];
  merged.liveChecks = {...(remote.liveChecks||{})};
  const localChecks = local.liveChecks || {};
  Object.keys(localChecks).forEach(pid=>{
    const lc = localChecks[pid];
    const rc = merged.liveChecks[pid];
    if(!rc || (lc.ts||0) > (rc.ts||0)) merged.liveChecks[pid] = lc;
  });
  if((local.updatedAt||0) > (remote.updatedAt||0)){
    merged.chipValues = local.chipValues;
    merged.buyInRecipe = local.buyInRecipe;
    merged.name = local.name;
    merged.ended = local.ended;
    merged.endedAt = local.endedAt;
    merged.finalChips = local.finalChips;
  }
  return merged;
}
/* Fetch the latest shared state, merge it with ours, apply this device's
   specific change on top, then save — so a slower-polling phone never
   silently erases what someone else just logged. */
async function mutateAndSave(mutator){
  let remote = null;
  try{
    remote = await loadGame(state.game.code);
  }catch(e){
    console.error('read before mutate failed', e);
    flashToast('Sync read issue (' + (e.code || e.message || 'unknown') + ') — saved locally');
  }
  const base = mergeGames(remote, state.game);
  mutator(base);
  state.game = base;
  render();
  await saveGame();
  return state.game;
}

async function checkInWithCode(code){
  code = (code||'').trim();
  if(!code){ flashToast('Enter your code'); return false; }
  const grp = state.group;
  if(!grp){ flashToast('Group not loaded yet — try again in a moment'); return false; }
  const member = grp.members.find(m=>m.code===code);
  if(!member){ flashToast('Code not recognized'); return false; }
  const already = activePlayers(state.game).find(p=>p.memberId===member.id);
  if(already){ flashToast(`${member.name} is already checked in`); return false; }
  await mutateAndSave(g=>{
    g.players.push({ id: uid(), name: member.name, color: member.color, removed:false, memberId: member.id });

  return true;

}
function copySeasonSummary(){
  const grp = state.group;
  const games = groupFinishedGames(state.groupGamesCache);
  const totals = aggregateGroupStats(grp, state.groupGamesCache);
  const medals = ['🥇','🥈','🥉'];
  const lines = [`🃏 ANTE — ${grp.name}`, `${games.length} game day${games.length!==1?'s':''} played`, ''];
  totals.forEach((t,i)=> lines.push(`${medals[i]||'  '} ${t.name}  ${fmtPnl(Math.round(t.totalPnl))}`));
  const settlements = computeSettlementsFromRows(totals.map(t=>({name:t.name, amt:Math.round(t.totalPnl)})));
  if(settlements.length){ lines.push('', 'Settle up:'); settlements.forEach(s=> lines.push(`${s.from} pays ${s.to} ${fmt(s.amount)}`)); }
  const text = lines.join('\n');
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>flashToast('Copied — paste it into Splitwise')).catch(()=>flashToast('Could not copy'));
  else flashToast('Could not copy');
}

/* ============================= MODAL LIFECYCLE ============================= */
function openModal(type, data){
  state.modal = { type, ...data };
  if(type==='buyin') state.modalData = { chips: {...recipeOf(state.game)} };
  else if(type==='transfer') state.modalData = { mode:'buyins', qty:1, chips: emptyChips(), fromId: data.fromId||null, toId:null };
  else if(type==='settings') state.modalData = { chipValues: {...state.game.chipValues}, buyInRecipe: {...recipeOf(state.game)} };
  else if(type==='addplayer') state.modalData = { name:'', code:'', mode: (state.game && state.game.groupCode) ? 'code' : 'guest' };
  else if(type==='addmember') state.modalData = { name:'' };
  else if(type==='rename') state.modalData = { name: data.currentName||'' };
  else if(type==='playermenu') state.modalData = {};
  else if(type==='share') state.modalData = {};
  else if(type==='livecheck'){
    const existing = liveCheckOf(state.game, data.playerId);
    state.modalData = { chips: existing ? {...existing.chips} : {...chipsHeld(state.game, data.playerId)} };
  }
  render();
}
function closeModal(){
  state.modal=null; state.modalData={};
  if(pendingRemoteGroupUpdate){
    const remoteGrp = pendingRemoteGroupUpdate; pendingRemoteGroupUpdate = null;
    applyRemoteGroupUpdate(remoteGrp);
  }
  if(pendingRemoteUpdate){
    const remote = pendingRemoteUpdate; pendingRemoteUpdate = null;
    applyRemoteUpdate(remote);
  } else render();
}

function seatPosition(i, n, rx, ry){
  const angle = (-90 + (360/n)*i) * Math.PI/180;
  const left = 50 + rx*Math.cos(angle);
  const top = 50 + ry*Math.sin(angle);
  return `left:${left.toFixed(2)}%; top:${top.toFixed(2)}%;`;
}
function seatCard(g,p,i,n){
  const held = chipsHeld(g,p.id);
  const val = chipValueOf(held, g.chipValues);
  const check = liveCheckOf(g,p.id);
  const est = check ? liveEstimatedPnl(g,p.id) : null;
  const pos = seatPosition(i, n, 43, 40);
  return `
  <button type="button" class="seat" style="${pos}" data-action="open-playermenu" data-player="${p.id}">
    ${check ? `<span class="seat-badge ${est>=0?'profit':'loss'}" title="Live estimate: ${fmtPnl(est)}">${est>=0?'▲':'▼'}</span>` : ''}
    ${avatar(p,54)}
    <div class="seat-name">${escapeHtml(p.name)}</div>
    <div class="seat-value mono">${fmt(val)}</div>
  </button>`;
}

function ledgerRow(g,a){
  const time = new Date(a.ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  if(a.type==='buyin'){
    const p = playerById(g,a.playerId);
    const val = chipValueOf(a.chips, g.chipValues);
    return `<div class="ledger-row"><span class="lr-time mono">${time}</span><span class="lr-icon buyin">↓</span><span class="lr-text"><b>${escapeHtml(p?p.name:'Removed player')}</b> bought in</span><span class="lr-amt mono">${fmt(val)}</span></div>`;
  }
  const from = playerById(g,a.fromId);
  const val = chipValueOf(a.chips, g.chipValues);
  if(a.toId==='BANK'){
    return `<div class="ledger-row"><span class="lr-time mono">${time}</span><span class="lr-icon cashout">🏦</span><span class="lr-text"><b>${escapeHtml(from?from.name:'—')}</b> cashed out to the bank</span><span class="lr-amt mono">${fmt(val)}</span></div>`;
  }
  const to = playerById(g,a.toId);
  return `<div class="ledger-row"><span class="lr-time mono">${time}</span><span class="lr-icon transfer">⇄</span><span class="lr-text"><b>${escapeHtml(from?from.name:'—')}</b> → <b>${escapeHtml(to?to.name:'—')}</b></span><span class="lr-amt mono">${fmt(val)}</span></div>`;
}

function viewEndgame(){
  const g = state.game;
  const players = activePlayers(g);
  const fc = state.modalData.finalChips;
  const totalBuy = totalBuyins(g);
  const cashedOut = totalCashedOut(g);
  const expectedOnTable = totalBuy - cashedOut;
  const totalCounted = players.reduce((s,p)=> s + chipValueOf(fc[p.id]||emptyChips(), g.chipValues), 0);
  const diff = Math.round(totalCounted-expectedOnTable);
  return `
  <div class="endgame-view">
    <header class="rail">
      <div class="rail-left"><div class="brand-sm"><span class="brand-mark">♠</span>ANTE</div>${g.groupCode?`<button class="link-btn" data-action="back-to-group" title="Back to group">← ${escapeHtml(g.groupName||'Group')}</button>`:''}<div class="game-name">${escapeHtml(g.name)} · Final Count</div></div>
      <div class="rail-right"><button class="btn btn-ghost" data-action="back-to-game">Back to table</button></div>
    </header>
    <main class="endgame-body">
      <p class="modal-note center">Count every player's remaining chips and enter them below. We've pre-filled each with their current in-play total.</p>
      <div class="endgame-grid">
        ${players.map(p=>`
          <div class="endgame-card">
            <div class="pc-top">${avatar(p,40)}<div class="pc-info"><div class="pc-name">${escapeHtml(p.name)}</div><div class="pc-meta">In play: ${fmt(inPlay(g,p.id))}${cashedOutBy(g,p.id)>0?` · Cashed out: ${fmt(cashedOutBy(g,p.id))}`:''}</div></div></div>
            ${CHIP_COLORS.map(c=>stepperRow(c, (fc[p.id]||emptyChips())[c], 'final', p.id)).join('')}
            <div class="modal-total sm"><span>Counted</span><span class="mono">${fmt(chipValueOf(fc[p.id]||emptyChips(), g.chipValues))}</span></div>
          </div>`).join('')}
      </div>
      <div class="conservation-bar ${diff===0?'ok':'warn'}">
        <span>Buy-ins ${fmt(totalBuy)}${cashedOut>0?` · Cashed out ${fmt(cashedOut)}`:''} · Counted ${fmt(totalCounted)}</span>
        <span>${diff===0 ? 'Chips balanced ✓' : `Off by ${fmt(Math.abs(diff))} — ${diff>0?'too many chips counted':'chips missing, recount'}`}</span>
      </div>
      <button class="btn btn-primary btn-block btn-lg" data-action="finish-game">Finish Game &amp; Reveal Results</button>
    </main>
  </div>`;
}

function renderPodiumSlot(row, rank){
  if(!row) return `<div class="podium-slot empty rank-${rank}"></div>`;
  const discCount = rank===1 ? 14 : rank===2 ? 10 : 7;
  const medal = rank===1 ? '🥇' : rank===2 ? '🥈' : '🥉';
  const discs = Array.from({length:discCount}).map(()=>`<div class="stack-disc" style="--sc:${row.p.color}"></div>`).join('');
  return `
  <div class="podium-slot rank-${rank}">
    <div class="medal">${medal}</div>
    <div class="chip-stack">${discs}</div>
    <div class="podium-pedestal">
      <div class="podium-name">${escapeHtml(row.p.name)}</div>
      <div class="podium-pnl ${row.pnl>=0?'profit':'loss'} mono">${fmtPnl(row.pnl)}</div>
    </div>
  </div>`;
}

/* ============================= COPY HELPERS ============================= */
function copyCode(){
  const code = state.game.code;
  if(navigator.clipboard) navigator.clipboard.writeText(code).then(()=>flashToast('Room ID copied')).catch(()=>flashToast(code));
  else flashToast(code);
}
function copyInvite(){
  const g = state.game;
  const text = `Join our poker room — open the site, tap "Join a Room", and paste this Room ID:\n${g.code}`;
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>flashToast('Invite message copied')).catch(()=>flashToast('Could not copy'));
  else flashToast('Could not copy');
}
function copyResultsText(){
  const g = state.game;
  const rows = activePlayers(g).map(p=>({p, pnl: pnl(g,p.id)})).sort((a,b)=>b.pnl-a.pnl);
  const medals = ['🥇','🥈','🥉'];
  const lines = [`🃏 ANTE — ${g.name}`, `Duration: ${fmtElapsed((g.endedAt||Date.now())-g.createdAt)}`, ''];
  rows.forEach((row,i)=> lines.push(`${medals[i]||'  '} ${row.p.name}  ${fmtPnl(row.pnl)}`));
  const settlements = computeSettlements(g);
  if(settlements.length){ lines.push('', 'Settle up:'); settlements.forEach(s=> lines.push(`${s.from} pays ${s.to} ${fmt(s.amount)}`)); }
  const text = lines.join('\n');
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>flashToast('Copied to clipboard')).catch(()=>flashToast('Could not copy'));
  else flashToast('Could not copy');
}

/* ============================= CONFETTI ============================= */
function fireConfetti(){
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#c9a227','#e7c454','#4fae7b','#c1392b','#2d6a9f','#f3ecdd'];
  const pieces = Array.from({length:130}).map(()=>({
    x: Math.random()*canvas.width,
    y: -20 - Math.random()*canvas.height*0.5,
    w: 6+Math.random()*6,
    h: 8+Math.random()*10,
    vy: 2+Math.random()*3,
    vx: -1.5+Math.random()*3,
    rot: Math.random()*Math.PI,
    vr: -0.2+Math.random()*0.4,
    color: colors[Math.floor(Math.random()*colors.length)]
  }));
  let frame=0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(frame<200) requestAnimationFrame(tick); else canvas.remove();
  }
  tick();
}

/* ============================= RENDER PIPELINE ============================= */
function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart==='number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd==='number' ? active.selectionEnd : null;
  const scrollY = window.scrollY;

  document.getElementById('app').innerHTML = renderHTML();

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
  window.scrollTo(0, scrollY);

  if(state.view==='results' && !state.confettiPlayed){
    state.confettiPlayed = true;
    setTimeout(fireConfetti, 350);
  }
}

/* ============================= EVENT DELEGATION ============================= */
function onClick(e){
  if(e.target.classList && e.target.classList.contains('overlay')){ closeModal(); return; }
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const playerId = t.dataset.player;

  switch(action){
    case 'create-game': {
      const name = state.modalData.newGameName;
      const cv = state.modalData.newChipValues || DEFAULT_CHIP_VALUES;
      const recipe = state.modalData.newBuyInRecipe || DEFAULT_BUY_IN_RECIPE;
      createGame(name, cv, recipe);
      break;
    }
    case 'join-game': {
      const code = state.modalData.joinCode || '';
      if(!code.trim()){ flashToast('Paste the room ID first'); return; }
      joinGame(code);
      break;
    }
    case 'copy-code': copyCode(); break;
    case 'copy-invite': copyInvite(); break;
    case 'create-group': createGroup(state.modalData.newGroupName); break;
    case 'join-group': {
      const gcode = state.modalData.joinGroupCode || '';
      if(!gcode.trim()){ flashToast('Paste the group code first'); return; }
      joinGroupByCode(gcode);
      break;
    }
    case 'start-game-day': startGameDay(); break;
    case 'open-groupgame': openGroupGame(t.dataset.code); break;
    case 'back-to-group': backToGroupFromGame(); break;
    case 'open-addmember': openModal('addmember',{}); break;
    case 'confirm-addmember': confirmAddMember(); break;
    case 'copy-season-summary': copySeasonSummary(); break;
    case 'refresh-group-games': refreshGroupGames(); break;
    case 'addplayer-mode': state.modalData.mode = t.dataset.mode; render(); break;
    case 'copy-group-code': copyGroupCode(); break;
    case 'open-share': openModal('share',{}); break;
    case 'open-settings': openModal('settings',{}); break;
    case 'confirm-settings': confirmSettings(); break;
    case 'go-endgame': goEndGame(); break;
    case 'back-to-game': state.view='game'; render(); break;
    case 'finish-game': finishGame(); break;
    case 'reopen-game': reopenGame(); break;
    case 'new-game': backToLanding(); break;
    case 'copy-results': copyResultsText(); break;
    case 'open-addplayer': openModal('addplayer',{}); break;
    case 'confirm-addplayer': confirmAddPlayer(); break;
    case 'open-rename': openModal('rename',{playerId, currentName: playerById(state.game,playerId).name}); break;
    case 'confirm-rename': confirmRename(); break;
    case 'remove-player': removePlayer(playerId); break;
    case 'quick-buyin': quickBuyin(playerId); break;
    case 'open-buyin': openModal('buyin',{playerId}); break;
    case 'confirm-buyin': confirmBuyin(); break;
    case 'open-transfer': openModal('transfer',{fromId:playerId||null}); break;
    case 'confirm-transfer': confirmTransfer(); break;
    case 'open-playermenu': openModal('playermenu',{playerId}); break;
    case 'open-livecheck': openModal('livecheck',{playerId}); break;
    case 'confirm-livecheck': confirmLiveCheck(); break;
    case 'modal-close': closeModal(); break;
    case 'undo-last': undoLastAction(); break;
    case 'transfer-mode': state.modalData.mode = t.dataset.mode; render(); break;
    case 'qty-step': {
      let q = (state.modalData.qty||1) + parseInt(t.dataset.dir,10);
      if(q<1) q=1;
      state.modalData.qty = q;
      render();
      break;
    }
    case 'chip-step': {
      const color=t.dataset.color, dir=parseInt(t.dataset.dir,10), kind=t.dataset.kind, pId=t.dataset.player;
      const target = getChipsTarget(kind,pId);
      target[color] = Math.max(0,(target[color]||0)+dir);
      render();
      break;
    }
  }
}
function onInput(e){
  const t = e.target;
  const action = t.dataset.action;
  if(action==='field-input'){
    state.modalData[t.dataset.field] = t.value;
  } else if(action==='chip-input'){
    const kind=t.dataset.kind, pId=t.dataset.player, color=t.dataset.color;
    const target = getChipsTarget(kind,pId);
    let v = parseInt(t.value,10); if(isNaN(v)||v<0) v=0;
    target[color]=v;
    render();
  } else if(action==='chipvalue-input'){
    let v = parseInt(t.value,10); if(isNaN(v)||v<1) v=1;
    state.modalData.chipValues[t.dataset.color]=v;
    render();
  } else if(action==='newchipvalue-input'){
    let v = parseInt(t.value,10); if(isNaN(v)||v<1) v=1;
    state.modalData.newChipValues[t.dataset.color]=v;
    render();
  } else if(action==='newrecipe-input'){
    let v = parseInt(t.value,10); if(isNaN(v)||v<0) v=0;
    state.modalData.newBuyInRecipe[t.dataset.color]=v;
    render();
  } else if(action==='recipe-input'){
    let v = parseInt(t.value,10); if(isNaN(v)||v<0) v=0;
    state.modalData.buyInRecipe[t.dataset.color]=v;
    render();
  } else if(action==='qty-input'){
    let v = parseInt(t.value,10); if(isNaN(v)||v<1) v=1;
    state.modalData.qty=v;
    render();
  }
}
function onChange(e){
  const t = e.target;
  if(t.dataset.action==='select-change'){
    const field = t.dataset.field, val = t.value || null;
    state.modalData[field] = val;
    if(field==='fromId' && state.modalData.toId===val) state.modalData.toId = null;
    render();
  }
}

/* ============================= INIT ============================= */
function init(){
  const app = document.getElementById('app');
  app.addEventListener('click', onClick);
  app.addEventListener('input', onInput);
  app.addEventListener('change', onChange);
  render();
  setInterval(()=>{ if(state.view==='game' && !state.modal) render(); }, 30000);
}
document.addEventListener('DOMContentLoaded', init);
</script></body></html>
